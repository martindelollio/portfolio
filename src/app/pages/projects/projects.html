<div>
    <ul>
     
        @for (p of proyectos(); track $index){
            <li>
                <h1>{{p.nombre}}</h1>
                <h3>{{p.descripcion}}</h3>
                <h3>{{p.tecnologias}}</h3>
                <button [routerLink]="['/projects',  p.id]">Ver Proyecto</button>

            </li>

        }@empty{
            <h3>No hay proyectos disponibles.</h3>
        }

        
    </ul>
</div>
